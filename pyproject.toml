[project]
name = "suffix-gpu"
version = "0.1.0"
description = "GPU-resident suffix decoding drafter: suffix-array based speculative drafting with device-side matching, expansion and global memory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
test = ["pytest"]
vllm = ["arctic-inference"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suffix_gpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
